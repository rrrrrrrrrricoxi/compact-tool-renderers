name: Pi compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: [oldest, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install isolated Pi runtime and run compatibility suite
        run: node scripts/compatibility-check.mjs --pi ${{ matrix.pi }}
